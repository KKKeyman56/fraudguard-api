# Foundry config untuk test contract leverage flash loan (fork Base mainnet).
# Jalankan:  forge test --fork-url $BASE_RPC_URL -vvv
# Install dep:  forge install foundry-rs/forge-std

[profile.default]
src = "contracts"
test = "test"
libs = ["lib"]
solc = "0.8.26"
# Cancun wajib: Aave V3 di Base pakai transient storage (TSTORE/TLOAD).
# Tanpa ini fork test revert "NotActivated". (cancun butuh solc >= 0.8.24)
evm_version = "cancun"
optimizer = true
optimizer_runs = 200

# RPC alias opsional: forge test --fork-url base
[rpc_endpoints]
base = "${BASE_RPC_URL}"
